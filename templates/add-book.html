<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookStore — Add New Book</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-main: #faf9f6;
            --bg-card: #ffffff;
            --text-primary: #18181b;
            --text-secondary: #52525b;
            --text-muted: #71717a;
            --accent-primary: #1e293b;
            --accent-hover: #0f172a;
            --brand-highlight: #d97706;
            --border-color: #e4e4e7;
            --input-bg: #fcfcfd;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 14px 30px -10px rgba(0, 0, 0, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        /* Top Bar */
        nav {
            background-color: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            padding: 16px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            font-family: 'Playfair Display', serif;
            font-size: 24px;
            font-weight: 700;
            color: var(--text-primary);
            text-decoration: none;
            letter-spacing: -0.5px;
        }

        .brand span {
            color: var(--brand-highlight);
        }

        .back-link {
            text-decoration: none;
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 600;
            transition: color 0.2s ease;
        }

        .back-link:hover {
            color: var(--text-primary);
        }

        /* Form Wrapper */
        .page-wrapper {
            max-width: 740px;
            margin: 44px auto 72px;
            padding: 0 20px;
        }

        .form-header {
            margin-bottom: 24px;
        }

        .form-header .eyebrow {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--brand-highlight);
            margin-bottom: 6px;
            display: block;
        }

        .form-header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 32px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.4px;
            margin-bottom: 6px;
        }

        .form-header p {
            color: var(--text-secondary);
            font-size: 15px;
        }

        /* Form Card */
        .book-form-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 32px;
            box-shadow: var(--shadow-md);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group {
            margin-bottom: 22px;
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .input-prefix-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-prefix {
            position: absolute;
            left: 14px;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 15px;
            pointer-events: none;
        }

        .input-prefix-wrapper input {
            padding-left: 30px;
        }

        input[type="text"],
        input[type="number"],
        textarea,
        select {
            width: 100%;
            padding: 12px 14px;
            font-size: 14px;
            font-family: inherit;
            color: var(--text-primary);
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
        }

        input[type="text"]:focus,
        input[type="number"]:focus,
        textarea:focus,
        select:focus {
            background-color: #ffffff;
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(30, 41, 59, 0.08);
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        /* File Upload Styling */
        .file-upload-box {
            position: relative;
            border: 1.5px dashed #cbd5e1;
            background-color: #fafafa;
            border-radius: 12px;
            padding: 18px 16px;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.2s ease, background-color 0.2s ease;
        }

        .file-upload-box:hover {
            border-color: var(--accent-primary);
            background-color: #f4f4f5;
        }

        .file-upload-box input[type="file"] {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .upload-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            display: block;
            margin-bottom: 2px;
        }

        .upload-hint {
            font-size: 12px;
            color: var(--text-muted);
            display: block;
        }

        .file-selected-name {
            margin-top: 6px;
            font-size: 12px;
            font-weight: 600;
            color: var(--brand-highlight);
            min-height: 18px;
        }

        /* Submit Button */
        .form-actions {
            margin-top: 8px;
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }

        .btn-submit {
            width: 100%;
            padding: 14px 24px;
            background-color: var(--accent-primary);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-family: inherit;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: var(--shadow-sm);
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        .btn-submit:hover {
            background-color: var(--accent-hover);
        }

        .btn-submit:active {
            transform: scale(0.995);
        }

        @media (max-width: 640px) {
            nav {
                padding: 14px 20px;
            }
            .book-form-card {
                padding: 22px 18px;
            }
            .form-row {
                grid-template-columns: 1fr;
                gap: 0;
            }
            .form-header h1 {
                font-size: 26px;
            }
        }
    </style>
</head>
<body>

    <nav>
        <a href="{% url 'home' %}" class="brand">Book<span>Store</span></a>
        <a href="{% url 'home' %}" class="back-link">← Back to Catalog</a>
    </nav>

    <main class="page-wrapper">
        <div class="form-header">
            <span class="eyebrow">Catalog Publishing</span>
            <h1>Publish a New Book</h1>
            <p>Add book details, cover artwork, and the downloadable PDF file to list it in the store.</p>
        </div>

        <form method="POST" enctype="multipart/form-data" class="book-form-card">
            {% csrf_token %}

            <div class="form-group">
                <label for="id_name">Book Name</label>
                <input id="id_name" type="text" name="name" placeholder="e.g., The Art of Quiet Focus" required>
            </div>

            <div class="form-group">
                <label for="id_description">Description</label>
                <textarea id="id_description" name="description" placeholder="Write a compelling summary of what readers will find inside..." required></textarea>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="id_category">Category</label>
                    <select id="id_category" name="category" required>
                        <option value="">Select Category</option>
                        {% for category in category %}
                            <option value="{{ category.id }}">{{ category.name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label for="id_price">Price</label>
                    <div class="input-prefix-wrapper">
                        <span class="input-prefix">$</span>
                        <input id="id_price" type="number" name="price" step="0.01" min="0" placeholder="22" required>
                    </div>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="id_image">Book Image</label>
                    <div class="file-upload-box">
                        <input id="id_image" type="file" name="image" accept="image/*" required>
                        <span class="upload-title">Choose cover image</span>
                        <span class="upload-hint">PNG, JPG, or WEBP</span>
                        <div class="file-selected-name" id="image-file-name"></div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="id_file">Book File (PDF)</label>
                    <div class="file-upload-box">
                        <input id="id_file" type="file" name="file" accept=".pdf" required>
                        <span class="upload-title">Choose PDF manuscript</span>
                        <span class="upload-hint">PDF format only</span>
                        <div class="file-selected-name" id="pdf-file-name"></div>
                    </div>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-submit">Create Book</button>
            </div>
        </form>
    </main>

    <script>
        const imageInput = document.getElementById('id_image');
        const imageNameLabel = document.getElementById('image-file-name');

        const pdfInput = document.getElementById('id_file');
        const pdfNameLabel = document.getElementById('pdf-file-name');

        imageInput.addEventListener('change', (e) => {
            imageNameLabel.textContent = e.target.files[0] ? `Selected: ${e.target.files[0].name}` : '';
        });

        pdfInput.addEventListener('change', (e) => {
            pdfNameLabel.textContent = e.target.files[0] ? `Selected: ${e.target.files[0].name}` : '';
        });
    </script>
</body>
</html>
