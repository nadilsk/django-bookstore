<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Login — BookStore</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-main: #faf9f6;
            --bg-card: #ffffff;
            --text-primary: #18181b;
            --text-secondary: #52525b;
            --text-muted: #71717a;
            --accent-primary: #1e293b;
            --accent-hover: #0f172a;
            --brand-highlight: #d97706;
            --border-color: #e4e4e7;
            --input-bg: #fcfcfd;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 14px 30px -10px rgba(0, 0, 0, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 32px 20px;
            -webkit-font-smoothing: antialiased;
        }

        .auth-shell {
            width: 100%;
            max-width: 420px;
        }

        .auth-topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
            padding: 0 4px;
        }

        .brand {
            font-family: 'Playfair Display', serif;
            font-size: 24px;
            font-weight: 700;
            color: var(--text-primary);
            text-decoration: none;
            letter-spacing: -0.5px;
        }

        .brand span {
            color: var(--brand-highlight);
        }

        .back-link {
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            transition: color 0.2s ease;
        }

        .back-link:hover {
            color: var(--text-primary);
        }

        .login-container {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 34px 30px;
            border-radius: 16px;
            box-shadow: var(--shadow-md);
            width: 100%;
        }

        .login-header {
            margin-bottom: 24px;
        }

        .eyebrow {
            display: block;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--brand-highlight);
            margin-bottom: 6px;
        }

        .login-container h2 {
            font-family: 'Playfair Display', serif;
            color: var(--text-primary);
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.4px;
            margin-bottom: 4px;
        }

        .login-subtitle {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            color: var(--text-primary);
            font-weight: 600;
            font-size: 13px;
        }

        .form-group input {
            width: 100%;
            padding: 11px 14px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            font-family: inherit;
            font-size: 14px;
            color: var(--text-primary);
            transition: border-color 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
        }

        .form-group input:focus {
            outline: none;
            background-color: #ffffff;
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(30, 41, 59, 0.08);
        }

        .submit-btn {
            width: 100%;
            padding: 13px 20px;
            background-color: var(--accent-primary);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-family: inherit;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 6px;
            box-shadow: var(--shadow-sm);
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        .submit-btn:hover {
            background-color: var(--accent-hover);
        }

        .submit-btn:active {
            transform: scale(0.995);
        }

        .register-link {
            text-align: center;
            margin-top: 22px;
            padding-top: 18px;
            border-top: 1px solid var(--border-color);
            font-size: 14px;
            color: var(--text-secondary);
        }

        .register-link a {
            color: var(--brand-highlight);
            text-decoration: none;
            font-weight: 600;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 26px 20px;
            }
            .login-container h2 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>

    <div class="auth-shell">
        <div class="auth-topbar">
            <a href="{% url 'home' %}" class="brand">Book<span>Store</span></a>
            <a href="{% url 'home' %}" class="back-link">← Catalog</a>
        </div>

        <div class="login-container">
            <div class="login-header">
                <span class="eyebrow">Member Access</span>
                <h2>Welcome Back</h2>
                <p class="login-subtitle">Sign in to access your cart, library, and listings.</p>
            </div>

            <form method="POST">
                {% csrf_token %}
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="Enter your username" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                </div>

                <button type="submit" class="submit-btn">Log In</button>
            </form>

            <div class="register-link">
                Don't have an account? <a href="/register/">Register here</a>
            </div>
        </div>
    </div>

</body>
</html>
